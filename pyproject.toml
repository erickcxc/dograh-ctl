[project]
name = "dograh-ctl"
version = "0.2.0"
description = "A CLI to run a self-hosted Dograh voice-agent platform from the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Erick Paniagua" }]
keywords = ["dograh", "voice-ai", "voice-agents", "cli", "mcp", "twilio", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/erickcxc/dograh-ctl"
Repository = "https://github.com/erickcxc/dograh-ctl"
Issues = "https://github.com/erickcxc/dograh-ctl/issues"
Changelog = "https://github.com/erickcxc/dograh-ctl/releases"

[project.scripts]
dograh-ctl = "dograh_ctl.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
